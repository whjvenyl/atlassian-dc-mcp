name: publish

# Publishes release artifacts for a given tag.
#
# Triggered two ways:
#   - workflow_call:   release-please.yml calls this after creating a
#                      release (tag_name comes from its outputs)
#   - workflow_dispatch: manual re-publish for any existing tag —
#                      e.g. after enabling trusted publishing
#
# npm auth: trusted publishing (OIDC) only — requires the repo variable
# NPM_TRUSTED_PUBLISHING=true and npm-side trusted-publisher config.
# npm deprecated automation tokens; granular tokens fail with EOTP under
# publish-2FA, so no token path exists here at all.

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release git tag name (e.g., v0.3.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release git tag name to publish (e.g., v0.3.0)"
        required: true
        type: string

permissions:
  contents: write      # upload release assets
  id-token: write      # npm OIDC / provenance

concurrency:
  group: publish-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"

      - name: Install & build
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Tag matches package.json version
        run: |
          tag="${{ inputs.tag_name }}"
          pkg="$(node -p "require('./package.json').version")"
          [ "${tag#v}" = "$pkg" ] || {
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          }

      - name: Publish to npm (trusted publishing via OIDC)
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        # --provenance attaches the Sigstore attestation; with trusted
        # publishing it binds to the workflow's OIDC identity
        run: npm publish --access public --provenance

      - name: npm publish skipped
        if: vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "::notice::NPM_TRUSTED_PUBLISHING != true — skipping npm publish"
          echo "npm publish skipped (trusted publishing not configured — see release-please docs in README)" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: Build ${{ matrix.out }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64,    out: atlassian-dc-mcp-linux-x64 }
          - { target: bun-linux-arm64,  out: atlassian-dc-mcp-linux-arm64 }
          - { target: bun-darwin-arm64, out: atlassian-dc-mcp-darwin-arm64 }
          - { target: bun-darwin-x64,   out: atlassian-dc-mcp-darwin-x64 }
          - { target: bun-windows-x64,  out: atlassian-dc-mcp-windows-x64.exe }
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: oven-sh/setup-bun@v2

      - run: npm ci   # reproducible node_modules for the bundler

      - name: compile ${{ matrix.out }}
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.out }}

      - name: smoke-run binary
        if: matrix.target == 'bun-linux-x64'
        run: |
          chmod +x ${{ matrix.out }}
          set +e; out=$(./${{ matrix.out }} 2>&1); code=$?; set -e
          echo "$out"; [ "$code" -eq 2 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release-assets:
    name: Attach binaries to release
    needs: [publish-npm, binaries]
    # binaries are the hard dependency; a failed npm publish must not
    # block the assets reaching the release
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist-bin

      - name: checksums
        run: cd dist-bin && sha256sum * > SHA256SUMS

      # release-please already created the release — just attach assets
      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist-bin/*
