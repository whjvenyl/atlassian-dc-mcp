name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Smoke: server must fail fast with a clear message when no URLs set
      - name: smoke — exits 2 without config
        run: |
          set +e
          out=$(node dist/index.js 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }
          echo "$out" | grep -q "CONFLUENCE_BASE_URL"
