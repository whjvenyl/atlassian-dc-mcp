name: release

# On a v* tag:
#   1. publish-npm  — version check, build, npm publish (token or trusted
#      publishing; skipped cleanly when neither is configured)
#   2. binaries     — bun --compile standalone binaries per platform
#   3. github-release — creates the GitHub Release with the binaries +
#      sha256 checksums attached
#
# Tag flow:
#   bump version in package.json to match the tag, then:
#   git tag -a vX.Y.Z -m "vX.Y.Z" && git push --follow-tags
#
# npm auth: trusted publishing ONLY — no token is stored anywhere.
# npm deprecated automation tokens, and granular tokens fail with EOTP
# under account-level publish-2FA — OIDC is the only CI path that works.
#
# Setup (once): publish the first version locally (npm login + publish)
# so the package exists, then on npmjs.com set the trusted publisher to
# this repo + release.yml, and set repo variable
#   NPM_TRUSTED_PUBLISHING=true
# Without that variable the npm step is skipped and the tag still
# produces the GitHub Release + binaries (+ GHCR image via docker.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # npm --provenance / trusted publishing OIDC

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          }

      - name: publish to npm (trusted publishing via OIDC)
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        # --provenance attaches the Sigstore attestation npm shows on the
        # package page; with trusted publishing it uses the OIDC identity
        run: npm publish --provenance --access public

      - name: npm publish skipped
        if: vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "::notice::NPM_TRUSTED_PUBLISHING != true — skipping npm publish"
          echo "npm publish skipped (trusted publishing not configured — see release.yml header)" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64,    out: atlassian-dc-mcp-linux-x64 }
          - { target: bun-linux-arm64,  out: atlassian-dc-mcp-linux-arm64 }
          - { target: bun-darwin-arm64, out: atlassian-dc-mcp-darwin-arm64 }
          - { target: bun-darwin-x64,   out: atlassian-dc-mcp-darwin-x64 }
          - { target: bun-windows-x64,  out: atlassian-dc-mcp-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2

      - run: npm ci   # reproducible node_modules for the bundler

      - name: compile ${{ matrix.out }}
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.out }}

      - name: smoke-run binary
        if: matrix.target == 'bun-linux-x64'
        run: |
          chmod +x ${{ matrix.out }}
          set +e; out=$(./${{ matrix.out }} 2>&1); code=$?; set -e
          echo "$out"; [ "$code" -eq 2 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  github-release:
    needs: [publish-npm, binaries]
    # binaries are the hard dependency; a failed npm publish (e.g. EOTP
    # from account-level 2FA, or missing token) must not block the Release
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # gh release create requires a git repo cwd

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist-bin

      - name: checksums
        run: cd dist-bin && sha256sum * > SHA256SUMS

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist-bin/*
