name: release

# Publish to npm + create a GitHub Release when a v* tag is pushed.
#
# Tag flow:
#   npm version patch   # bumps package.json, creates commit + tag
#   git push --follow-tags
#
# npm auth — two supported modes, checked in order:
#   1. NPM_TOKEN repo secret (npm granular access token, read+write on the
#      package or "All packages I own"). Needed for the FIRST publish —
#      npm only allows granular tokens now, and a package must exist
#      before it can be token-scoped.
#   2. Trusted publishing: configure on npmjs.com (repo + release.yml),
#      then set repo variable NPM_TRUSTED_PUBLISHING=true and delete the
#      secret — publishes authenticate via GitHub OIDC, no token at all.
# With neither configured the npm step is skipped and the tag still
# produces the GitHub Release (and the GHCR image via docker.yml).
# --provenance signs a Sigstore attestation via OIDC either way.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # npm --provenance signing

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    env:
      # makes the secret testable in step-level `if:` (secrets can't be used there directly)
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || {
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          }

      - name: publish to npm (token)
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish to npm (trusted publishing)
        if: env.NPM_TOKEN == '' && vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm publish --access public

      - name: npm publish skipped
        if: env.NPM_TOKEN == '' && vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "::notice::no NPM_TOKEN secret and NPM_TRUSTED_PUBLISHING != true — skipping npm publish"
          echo "npm publish skipped (no token, no trusted publishing)" >> "$GITHUB_STEP_SUMMARY"

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
